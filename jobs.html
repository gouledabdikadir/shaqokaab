<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse open positions and opportunities on shaqokaab." /><title>Browse Jobs | shaqokaab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" />
</head>
<body data-page="jobs">
  <header class="site-header"><div class="container nav-wrap"><a href="index.html" class="brand"><span class="brand-mark">s</span><span class="brand-text">shaqokaab</span></a><nav class="main-nav"><a href="jobs.html">Jobs</a><a href="candidate.html">My dashboard</a><a href="index.html#companies">Companies</a><a href="employer.html">For employers</a></nav><div class="nav-actions"><a href="candidate.html" class="link-btn">My dashboard</a><a href="employer.html" class="primary-btn">Post a job</a></div></div></header>
  <main class="page-shell"><section class="board-hero"><div class="container board-hero-inner"><div><span class="eyebrow accent">Find your next role</span><h1>Discover jobs built for growth.</h1></div><a href="employer.html" class="primary-btn">Hire talent</a></div></section>
    <section class="job-board"><div class="container board-layout"><aside class="filters-panel"><h2>Filters</h2><label class="input-wrap"><span>Keyword</span><input id="keywordInput" type="search" placeholder="Search jobs" /></label><label class="input-wrap filter-group"><span>Location</span><select id="locationFilter"><option value="all">All locations</option><option>Mogadishu</option><option>Hargeisa</option><option>Nairobi</option><option>Remote</option></select></label><label class="input-wrap filter-group"><span>Type</span><select id="typeFilter"><option value="all">Any type</option><option>Full-time</option><option>Contract</option><option>Part-time</option><option>Remote</option></select></label><div class="chip-row large-row"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="remote">Remote</button><button class="chip" data-filter="full-time">Full-time</button><button class="chip" data-filter="contract">Contract</button></div></aside>
      <section class="results-panel"><div class="results-header"><h2>Open roles</h2><span id="resultCount">0 roles</span></div><div id="jobResults" class="jobs-grid board-jobs" aria-live="polite"></div></section></div></section></main>
  <footer class="site-footer"><div class="container footer-wrap"><div><a href="index.html" class="brand footer-brand"><span class="brand-mark">s</span><span class="brand-text">shaqokaab</span></a><p>Connecting talent to opportunity across Africa and beyond.</p></div><div class="footer-links"><a href="candidate.html">My dashboard</a><a href="employer.html">For employers</a></div></div></footer>
  <script src="script.js"></script>
</body>
</html>
