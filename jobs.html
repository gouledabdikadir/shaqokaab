<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Jobs | shaqokaab</title>
    <meta
      name="description"
      content="Browse open positions and opportunities on shaqokaab."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="jobs">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="shaqokaab home">
          <span class="brand-mark">s</span>
          <span class="brand-text">shaqokaab</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="jobs.html">Jobs</a>
          <a href="index.html#companies">Companies</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#post-job">Post a job</a>
        </nav>

        <div class="nav-actions">
          <a href="jobs.html" class="link-btn">Browse Jobs</a>
          <a href="index.html#post-job" class="primary-btn">Post a Job</a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="board-hero">
        <div class="container board-hero-inner">
          <div>
            <span class="eyebrow accent">Find your next role</span>
            <h1>Discover jobs built for growth.</h1>
          </div>
          <a href="index.html#post-job" class="primary-btn">Hire talent</a>
        </div>
      </section>

      <section class="job-board">
        <div class="container board-layout">
          <aside class="filters-panel">
            <h2>Filters</h2>

            <div class="filter-group">
              <label class="input-wrap">
                <span>Keyword</span>
                <input id="keywordInput" type="text" placeholder="Search jobs" />
              </label>
            </div>

            <div class="filter-group">
              <label class="input-wrap">
                <span>Location</span>
                <select id="locationFilter">
                  <option value="all">All locations</option>
                  <option value="Mogadishu">Mogadishu</option>
                  <option value="Hargeisa">Hargeisa</option>
                  <option value="Nairobi">Nairobi</option>
                  <option value="Remote">Remote</option>
                </select>
              </label>
            </div>

            <div class="filter-group">
              <label class="input-wrap">
                <span>Type</span>
                <select id="typeFilter">
                  <option value="all">Any</option>
                  <option value="Full-time">Full-time</option>
                  <option value="Contract">Contract</option>
                  <option value="Part-time">Part-time</option>
                  <option value="Remote">Remote</option>
                </select>
              </label>
            </div>

            <div class="chip-row large-row" id="filterChips" aria-label="Job category filters">
              <button class="chip active" data-filter="all">All</button>
              <button class="chip" data-filter="remote">Remote</button>
              <button class="chip" data-filter="full-time">Full-time</button>
              <button class="chip" data-filter="contract">Contract</button>
            </div>
          </aside>

          <div class="results-panel">
            <div class="results-header">
              <h2>Open roles</h2>
              <span id="resultCount">0 roles</span>
            </div>
            <div id="jobResults" class="jobs-grid board-jobs" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <a href="index.html" class="brand footer-brand">
            <span class="brand-mark">s</span>
            <span class="brand-text">shaqokaab</span>
          </a>
          <p>Connecting talent to opportunity across Africa and beyond.</p>
        </div>

        <div class="footer-links">
          <a href="jobs.html">Jobs</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#post-job">Employers</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
